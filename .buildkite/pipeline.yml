steps:
  - label: "CUDA"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.12"
    agents:
      queue: "cuda"
    command: |
      julia --color=yes --project=test -e 'using Pkg; Pkg.add("CUDA"); Pkg.develop(path="."); Pkg.instantiate()'
      julia --color=yes --project=test -e 'include("test/runtests.jl")'
    env:
      POINTNEIGHBORS_TEST: cuda
    timeout_in_minutes: 60

  - label: "AMDGPU"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.12"
    agents:
      queue: "rocm"
    command: |
      julia --color=yes --project=test -e 'using Pkg; Pkg.add("AMDGPU"); Pkg.develop(path="."); Pkg.instantiate()'
      julia --color=yes --project=test -e 'include("test/runtests.jl")'
    env:
      POINTNEIGHBORS_TEST: amdgpu
    timeout_in_minutes: 60

  - label: "Metal"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.12"
    agents:
      queue: "metal"
    command: |
      julia --color=yes --project=test -e 'using Pkg; Pkg.add("Metal"); Pkg.develop(path="."); Pkg.instantiate()'
      julia --color=yes --project=test -e 'include("test/runtests.jl")'
    env:
      POINTNEIGHBORS_TEST: metal
    timeout_in_minutes: 60

  # oneAPI doesn't support exceptions, which fails some of our tests.
  # Additionally, we never worked with Intel data center GPUs, so these tests would suggest support that isn't actually there.
