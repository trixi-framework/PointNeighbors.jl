name: Documentation

on:
  push:
    branches:
      - 'main'
    tags: '*'
    paths-ignore:
      - '.github/workflows/ci.yml'
      - '.github/workflows/CompatHelper.yml'
      - '.github/workflows/TagBot.yml'
  pull_request:
    paths-ignore:
      - '.github/workflows/ci.yml'
      - '.github/workflows/CompatHelper.yml'
      - '.github/workflows/TagBot.yml'
  workflow_dispatch:

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  build-docs:
    name: Build and Deploy Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v7
      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1'
          show-versioninfo: true
      - uses: julia-actions/cache@v3
      - name: Build package
        uses: julia-actions/julia-buildpkg@v1
      - name: Install dependencies
        run: julia --project=docs/ -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Generate benchmark plots
        env:
          GKSwstype: '100'
        run: |
          julia --project=docs/ -e '
            include("benchmarks/plot_benchmarks.jl")
            output_directory = joinpath("docs", "src", "assets", "benchmarks")
            mkpath(output_directory)
            savefig(plot!(plot_machines_wcsph(); title = ""),
                    joinpath(output_directory, "machines_wcsph.png"))
            savefig(plot!(plot_machines_tlsph(); title = ""),
                    joinpath(output_directory, "machines_tlsph.png"))
            savefig(plot!(plot_machines_tlsph_deformation_grad(); title = ""),
                    joinpath(output_directory, "machines_tlsph_deformation_gradient.png"))
            savefig(plot!(plot_implementations_wcsph(); title = ""),
                    joinpath(output_directory, "implementations_wcsph.png"))
            savefig(plot!(plot_update_strategies(); title = ""),
                    joinpath(output_directory, "update_strategies.png"))
          '
      - name: Build and deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} # For authentication with SSH deploy key
        run: julia --project=docs --color=yes docs/make.jl
